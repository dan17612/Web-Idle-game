<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Halloween-Variante des Zoo-Empire-Icons: die Pfote aus Kürbissen,
       Ballen = Kürbislaterne, dazu Mondsichel und Nachthimmel.
       PNG-Fassungen: icon-halloween-*.png (gleiche Zeichnung). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2470"/>
      <stop offset="1" stop-color="#120b2a"/>
    </linearGradient>
    <radialGradient id="pumpkin" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ffb24a"/>
      <stop offset="0.55" stop-color="#f47c20"/>
      <stop offset="1" stop-color="#bf4f0a"/>
    </radialGradient>
    <radialGradient id="light" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#ffbf2e"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="420" cy="88" r="38" fill="#fff"/>
      <circle cx="402" cy="74" r="34" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <g id="art">
    <!-- Sterne und Mond -->
    <g fill="#fff3c9">
      <circle cx="78" cy="70" r="5"/>
      <circle cx="350" cy="44" r="4"/>
      <circle cx="466" cy="196" r="4"/>
      <circle cx="52" cy="230" r="3.5"/>
    </g>
    <circle cx="420" cy="88" r="38" fill="#ffe7a8" mask="url(#crescent)"/>

    <!-- Schein hinter der Laterne -->
    <circle cx="256" cy="342" r="170" fill="url(#halo)"/>

    <!-- Zehen: drei kleine Kürbisse -->
    <g>
      <g transform="translate(150 178)">
        <ellipse rx="50" ry="43" fill="url(#pumpkin)"/>
        <path d="M-16 -38 Q-26 0 -16 38 M16 -38 Q26 0 16 38" fill="none" stroke="#a8460a" stroke-opacity="0.45" stroke-width="5"/>
        <rect x="-6" y="-56" width="12" height="18" rx="4" fill="#4f8f2e" transform="rotate(-12)"/>
      </g>
      <g transform="translate(256 124)">
        <ellipse rx="50" ry="43" fill="url(#pumpkin)"/>
        <path d="M-16 -38 Q-26 0 -16 38 M16 -38 Q26 0 16 38" fill="none" stroke="#a8460a" stroke-opacity="0.45" stroke-width="5"/>
        <rect x="-6" y="-56" width="12" height="18" rx="4" fill="#4f8f2e" transform="rotate(8)"/>
      </g>
      <g transform="translate(362 178)">
        <ellipse rx="50" ry="43" fill="url(#pumpkin)"/>
        <path d="M-16 -38 Q-26 0 -16 38 M16 -38 Q26 0 16 38" fill="none" stroke="#a8460a" stroke-opacity="0.45" stroke-width="5"/>
        <rect x="-6" y="-56" width="12" height="18" rx="4" fill="#4f8f2e" transform="rotate(14)"/>
      </g>
    </g>

    <!-- Ballen: Kürbislaterne -->
    <g>
      <rect x="244" y="222" width="24" height="40" rx="8" fill="#4f8f2e" transform="rotate(10 256 242)"/>
      <ellipse cx="200" cy="350" rx="78" ry="100" fill="url(#pumpkin)"/>
      <ellipse cx="312" cy="350" rx="78" ry="100" fill="url(#pumpkin)"/>
      <ellipse cx="256" cy="346" rx="80" ry="106" fill="url(#pumpkin)"/>
      <path d="M220 252 Q196 350 220 448 M292 252 Q316 350 292 448" fill="none" stroke="#a8460a" stroke-opacity="0.4" stroke-width="7"/>
      <!-- Gesicht -->
      <g fill="url(#light)">
        <path d="M178 330 L238 330 L208 280 Z"/>
        <path d="M274 330 L334 330 L304 280 Z"/>
        <path d="M244 362 L268 362 L256 342 Z"/>
        <path d="M160 378 Q256 452 352 378 L334 384 L318 400 L300 388 L282 408 L264 394 L248 410 L230 394 L212 406 L196 388 L180 396 Z"/>
      </g>
    </g>
  </g>
</svg>
